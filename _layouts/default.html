<!DOCTYPE html>
<html lang="{{ page.lang | default: "zh-Hans" }}">
  {%- include head.html -%}
  <body>
    <header class="site-header">
      <div class="site-nav shell">
        <a class="site-brand" href="{{ "/" | relative_url }}" aria-label="返回首页">
          <span>{{ site.author }}</span>
        </a>
        <nav class="site-links" aria-label="主导航">
          <a href="{{ "/archive.html" | relative_url }}"{% if page.url == "/archive.html" %} aria-current="page"{% endif %}>posts</a>
          <a href="https://github.com/EdgarDegas" target="_blank" rel="noreferrer">github</a>
          <a href="{{ "/feed.xml" | relative_url }}">rss</a>
        </nav>
      </div>
    </header>

    <main class="site-main" aria-label="主要内容">
      <div class="shell">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
    <script>
      if (window.hljs) {
        window.hljs.highlightAll();
      }
    </script>
  </body>
</html>
