<!DOCTYPE html>
<html lang="{{ page.lang | default: "zh-Hans" }}">
  {%- include head.html -%}
  <body>
    <main class="site-main" aria-label="主要内容">
      <div class="shell">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
    <script>
      if (window.hljs) {
        window.hljs.highlightAll();
      }
    </script>
    <script>
      (() => {
        const themes = new Set(["white", "paper", "warm", "dark", "black"]);
        const colors = {
          white: "#ffffff",
          paper: "#f7f5ef",
          warm: "#efe4cf",
          dark: "#171614",
          black: "#000000"
        };
        const root = document.documentElement;
        const options = document.querySelectorAll("[data-theme-option]");

        const applyTheme = (theme) => {
          if (!themes.has(theme)) return;

          root.dataset.theme = theme;
          document.querySelector("#theme-color")?.setAttribute("content", colors[theme]);
          options.forEach((option) => {
            option.setAttribute("aria-pressed", String(option.dataset.themeOption === theme));
          });

          try {
            window.sessionStorage.setItem("reading-theme", theme);
          } catch (error) {
            // The selected theme still applies for the current page.
          }
        };

        options.forEach((option) => {
          option.addEventListener("click", () => applyTheme(option.dataset.themeOption));
        });
        applyTheme(root.dataset.theme || "white");
      })();
    </script>
  </body>
</html>
