<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>
    {%- if page.title -%}
      {{ page.title }}
    {%- else -%}
      {{ site.title }}
    {%- endif -%}
  </title>

  {%-seo title=false-%}
  {%-feed_meta-%}
  <link type="application/rss+xml" rel="alternate" href="{{ site.url }}{{ site.baseurl }}/rss.xml" title="{{ site.title | escape }} RSS" />

  <meta id="theme-color" name="theme-color" content="#ffffff">
  <script>
    (() => {
      const themes = ["white", "paper", "warm", "dark", "black"];
      const colors = {
        white: "#ffffff",
        paper: "#f7f5ef",
        warm: "#efe4cf",
        dark: "#171614",
        black: "#000000"
      };
      let theme = "white";

      try {
        const savedTheme = window.sessionStorage.getItem("reading-theme");
        if (themes.includes(savedTheme)) theme = savedTheme;
      } catch (error) {
        // Storage can be unavailable in privacy-restricted browsing modes.
      }

      document.documentElement.dataset.theme = theme;
      document.querySelector("#theme-color")?.setAttribute("content", colors[theme]);
    })();
  </script>

  <link rel="shortcut icon" type="image/x-icon" href="{{ site.favicon | relative_url }}" />
  <link rel="stylesheet" href="/assets/css/hljs.css">
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#2d89ef">
  <meta name="google-site-verification" content="B_t-YTaJvID37m6sw-BkzSTbTJSwMqjXOeCTtGngaqY" />
</head>
