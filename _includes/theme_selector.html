<div class="theme-selector" role="group" aria-label="阅读配色">
  <button class="theme-option theme-option--white" type="button" data-theme-option="white" aria-label="纯白" title="纯白"></button>
  <button class="theme-option theme-option--paper" type="button" data-theme-option="paper" aria-label="白纸" title="白纸"></button>
  <button class="theme-option theme-option--warm" type="button" data-theme-option="warm" aria-label="暖色纸" title="暖色纸"></button>
  <button class="theme-option theme-option--dark" type="button" data-theme-option="dark" aria-label="深色" title="深色"></button>
  <button class="theme-option theme-option--black" type="button" data-theme-option="black" aria-label="纯黑" title="纯黑"></button>
</div>
